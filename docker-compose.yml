# Runs the existing API, dashboard, RabbitMQ, worker, and (optionally) MinIO in
# containers, api/dashboard/worker sharing one built image. results/,
# overleaf_exports/, and jobs/ are bind-mounted so evidence and job records
# generated inside a container are inspectable on the host, exactly like a
# non-Docker local run.
#
# RabbitMQ's AMQP port is published on the host as 5673 (not the default
# 5672) - api/worker reach it internally via "rabbitmq:5672" on the compose
# network regardless, but 5673 gives host-side tools (e.g. the Milestone 25
# real-broker end-to-end test) a safe, deliberately-non-default port to
# connect to. An earlier version of that test defaulted to localhost:5672
# and silently connected to a completely unrelated RabbitMQ container from
# another project that was already using the standard port on this machine.
# The management UI is likewise on an alternate host port (15673) to avoid
# clashing with any other RabbitMQ instance already using 15672.
#
# MinIO (Milestone 22) is the default EvidenceRepository backend for this
# containerised platform - see zeroshield.repositories.MinioEvidenceRepository
# and zeroshield.services.experiment_service.resolve_evidence_repository, the
# one function ZEROSHIELD_EVIDENCE_BACKEND is read through for BOTH writing
# evidence (run_experiment) and reading it back (load_latest_evidence, which
# every GET /experiments/{id}/verdict|results|evidence route and the
# dashboard go through). Its ports are on alternates (9002/9003) to avoid
# clashing with any other MinIO already using the default 9000/9001 on this
# machine.
#
# A prior version of this file set ZEROSHIELD_EVIDENCE_BACKEND=minio on
# worker/dashboard only, with api left on the local default - a real,
# confirmed bug: load_latest_evidence was hardcoded to LocalEvidenceRepository
# regardless of this setting, so a run's evidence, correctly written to MinIO,
# was invisible through every API/UI read path (404 "no_evidence" despite a
# real, completed, integrity-verifiable run). Fixed properly (not worked
# around) by making load_latest_evidence read through the same
# resolve_evidence_repository() the write path already used - see
# docs/DEPLOYMENT.md's final release verification report for the bug and the
# fix, and docs/OBSERVABILITY.md/SECURITY.md for anything else from that pass.
# api/worker/dashboard below all set ZEROSHIELD_EVIDENCE_BACKEND=minio now,
# consistently, so whichever service reads a run's evidence always agrees
# with whichever service wrote it.
#
# The bare-Python/CI/test default remains "local" (LocalEvidenceRepository) -
# resolve_evidence_repository()'s own code-level default - so nothing outside
# this compose file's containers needs a MinIO server running.
#
# Prometheus/Grafana (Milestone 23) scrape ONLY operational metrics (request
# counts/latency, job outcome counts/durations) from api:8000/metrics and
# worker:9200/metrics - never the scientific evidence, which stays under
# results/ and GET /experiments/{id}/results. Grafana is pre-provisioned
# with the Prometheus datasource and a small dashboard (monitoring/), so it
# is usable immediately with no manual clicking.
#
# dashboard's host port is 8502 (not Streamlit's default 8501) so `docker
# compose up` (all services) works out of the box even if something else on
# the host - e.g. a locally-run `streamlit run` from outside Docker - is
# already using 8501. The container's internal port is still 8501.
#
# postgres (V2 Platform Foundation phase) is the structured system of record
# for the rich run-lifecycle event trail (zeroshield.repositories.
# PostgresRunRepository) - api/worker read DATABASE_URL to use it; with no
# DATABASE_URL set (e.g. running the API/worker natively without Docker),
# they fall back to the no-op NullRunRepository, so nothing here is a hard
# requirement to run ZeroShield. Its host port is 5433, not Postgres's
# default 5432, for the same non-default-port reason documented above for
# rabbitmq/minio.
#
# web (V2 Phase 4) is the primary ZeroShield UI - a separate Next.js image (apps/web/
# Dockerfile), never sharing the Python image. It consumes the api service exclusively
# (API_BASE_URL, plus its own same-origin "/api/*" rewrite for the browser) - never
# Postgres/MinIO/RabbitMQ/Python directly. Host port 3001, not Next's default 3000,
# because Grafana already uses 3000 in this same compose file.
#
# intelligence-worker (V2 Phase 2) consumes the separate
# zeroshield.intelligence_syncs queue (zeroshield.worker.intelligence_main) so
# a slow/large NVD/CISA/EPSS sync never competes with or blocks
# experiment-run job processing on the `worker` service. Same image, just a
# different command - not a new microservice. Requires DATABASE_URL (the
# threat-intelligence system of record is PostgreSQL-backed, not optional).
#
# ./experiments:/app/experiments is bind-mounted on api/worker/dashboard
# (final release verification fix) - previously only intelligence-worker had
# it, each other service instead relying on the Dockerfile's build-time
# `COPY experiments ./experiments`, meaning each container had its own
# frozen, container-local copy with no visibility into what any other
# container wrote there. This was a real, reproduced bug: POST
# /experiment-versions/{id}/runs calls materialise_to_experiments_dir() on
# the api container, writing the approved experiment's JSON into api's own
# isolated /app/experiments/ - which worker's find_experiment() could never
# see, since worker had a *different* isolated /app/experiments/ containing
# only the two originally-baked-in bundled experiments. Every Studio-based
# run failed with "experiment could not be found when the job started" in
# the Dockerized deployment (the bare-Python/non-Docker path was unaffected,
# since there is only one process and one filesystem there). Now all three
# share the host's real experiments/ directory, exactly like
# intelligence-worker already did.
#
# ./test_data:/app/test_data is bind-mounted for the same reason, on the
# same three services - zeroshield.studio.builder writes each generated
# dataset to test_data/generated/<generator_id>/<sha256>.json (api
# container), and zeroshield.datasets.loader.load_test_set reads that same
# relative path (worker container) when a run actually executes. Without
# this mount, every Studio-submitted run failed with "the experiment's
# configured dataset ... could not be resolved on this server" - the exact
# same class of bug as the experiments/ one above, just one directory over.
#
# migrate (final release verification fix) is a one-shot service - same
# image, `alembic upgrade head`, then exits 0 - that runs once postgres is
# healthy and before api/worker/intelligence-worker start
# (depends_on: migrate: condition: service_completed_successfully). This is
# the only thing that actually applies the schema on a fresh `postgres_data`
# volume; without it, `docker compose up` on an empty volume would start the
# API against a database with no tables at all, and every DB-backed feature
# - including login, since auth is DB-backed from V2 Phase 6 - would fail at
# first use instead of never starting. Never Base.metadata.create_all() -
# Alembic is the single source of truth for schema, same as running it by
# hand outside Docker (see docs/HANDOVER.md).

services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: zeroshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroshield123}
      POSTGRES_DB: zeroshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeroshield -d zeroshield"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: zeroshield
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zeroshield123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  migrate:
    build: .
    image: zeroshield:latest
    environment:
      DATABASE_URL: postgresql+psycopg://zeroshield:${POSTGRES_PASSWORD:-zeroshield123}@postgres:5432/zeroshield
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: .
    image: zeroshield:latest
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://zeroshield:${POSTGRES_PASSWORD:-zeroshield123}@postgres:5432/zeroshield
      ZEROSHIELD_EVIDENCE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: zeroshield
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zeroshield123}
      MINIO_SECURE: "false"
    volumes:
      - ./results:/app/results
      - ./overleaf_exports:/app/overleaf_exports
      - ./jobs:/app/jobs
      - ./experiments:/app/experiments
      - ./test_data:/app/test_data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "uvicorn", "zeroshield.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build: .
    image: zeroshield:latest
    ports:
      - "9200:9200"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://zeroshield:${POSTGRES_PASSWORD:-zeroshield123}@postgres:5432/zeroshield
      ZEROSHIELD_EVIDENCE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: zeroshield
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zeroshield123}
      MINIO_SECURE: "false"
    volumes:
      - ./results:/app/results
      - ./jobs:/app/jobs
      - ./experiments:/app/experiments
      - ./test_data:/app/test_data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "zeroshield.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  intelligence-worker:
    build: .
    image: zeroshield:latest
    ports:
      - "9201:9201"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://zeroshield:${POSTGRES_PASSWORD:-zeroshield123}@postgres:5432/zeroshield
    volumes:
      - ./experiments:/app/experiments
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "zeroshield.worker.intelligence_main"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9201/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  dashboard:
    build: .
    image: zeroshield:latest
    ports:
      - "8502:8501"
    environment:
      ZEROSHIELD_EVIDENCE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: zeroshield
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zeroshield123}
      MINIO_SECURE: "false"
    volumes:
      - ./results:/app/results
      - ./overleaf_exports:/app/overleaf_exports
      - ./experiments:/app/experiments
      - ./test_data:/app/test_data
    depends_on:
      minio:
        condition: service_healthy
    command: ["python", "-m", "streamlit", "run", "src/zeroshield/dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build: ./apps/web
    image: zeroshield-web:latest
    ports:
      - "3001:3000"
    environment:
      # Server-side base URL (Server Components/Route Handlers, running in Node, reach
      # the api service directly on the compose network). The browser never talks to
      # this host:port - it goes through this app's own "/api/*" rewrite instead, so
      # the API never needs to grant CORS to this origin. See apps/web/next.config.ts.
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: zeroshield
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-zeroshield123}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  