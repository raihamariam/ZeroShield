[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is deliberately NOT set here - zeroshield.db.session.get_database_url()
# (DATABASE_URL env var, falling back to the same local-dev default used everywhere
# else in this project) is the single source of truth, read by alembic/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
