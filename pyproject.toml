[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeroshield"
version = "0.1.0"
description = "ZeroShield: A Sandbox-Based Validation Framework for Zero-Click Vulnerability Mitigations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.scripts]
zeroshield = "zeroshield.cli:main"
zeroshield-worker = "zeroshield.worker.main:main"

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.38",
    # Pin gitpython (streamlit's own transitive dependency) past GHSA-9rj7-rf2p-w77r
    # and related advisories fixed in 3.1.58 - ZeroShield code never imports it
    # directly, but tests/security/test_dependency_vulnerabilities.py scans the
    # whole installed environment, so a fresh install must resolve to a patched
    # version rather than streamlit's unpinned floor.
    "gitpython>=3.1.58",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
queue = [
    "pika>=1.3",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
storage = [
    "minio>=7.2",
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
intelligence = [
    "httpx>=0.27",
]
excel = [
    "openpyxl>=3.1",
]
ai = [
    "google-genai>=1.0",
]
auth = [
    "argon2-cffi>=23.1",
]
observability = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "pip-audit>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "openpyxl>=3.1",
    "google-genai>=1.0",
    "argon2-cffi>=23.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zeroshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/zeroshield"]
omit = [
    "src/zeroshield/__main__.py",
    "src/zeroshield/dashboard/app.py",
    "src/zeroshield/worker/__main__.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "pika.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true
