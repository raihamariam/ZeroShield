# Runs the existing API, dashboard, RabbitMQ, worker, and (optionally) MinIO in
# containers, api/dashboard/worker sharing one built image. results/,
# overleaf_exports/, and jobs/ are bind-mounted so evidence and job records
# generated inside a container are inspectable on the host, exactly like a
# non-Docker local run.
#
# RabbitMQ's AMQP port is published on the host as 5673 (not the default
# 5672) - api/worker reach it internally via "rabbitmq:5672" on the compose
# network regardless, but 5673 gives host-side tools (e.g. the Milestone 25
# real-broker end-to-end test) a safe, deliberately-non-default port to
# connect to. An earlier version of that test defaulted to localhost:5672
# and silently connected to a completely unrelated RabbitMQ container from
# another project that was already using the standard port on this machine.
# The management UI is likewise on an alternate host port (15673) to avoid
# clashing with any other RabbitMQ instance already using 15672.
#
# MinIO (Milestone 22) is an available, alternative EvidenceRepository
# backend - see zeroshield.repositories.MinioEvidenceRepository - not the
# default the api/worker services use (they still use the local filesystem).
# It is included here so it can be exercised manually; its ports are on
# alternates (9002/9003) to avoid clashing with any other MinIO already
# using the default 9000/9001 on this machine.
#
# Prometheus/Grafana (Milestone 23) scrape ONLY operational metrics (request
# counts/latency, job outcome counts/durations) from api:8000/metrics and
# worker:9200/metrics - never the scientific evidence, which stays under
# results/ and GET /experiments/{id}/results. Grafana is pre-provisioned
# with the Prometheus datasource and a small dashboard (monitoring/), so it
# is usable immediately with no manual clicking.
#
# dashboard's host port is 8502 (not Streamlit's default 8501) so `docker
# compose up` (all services) works out of the box even if something else on
# the host - e.g. a locally-run `streamlit run` from outside Docker - is
# already using 8501. The container's internal port is still 8501.
#
# postgres (V2 Platform Foundation phase) is the structured system of record
# for the rich run-lifecycle event trail (zeroshield.repositories.
# PostgresRunRepository) - api/worker read DATABASE_URL to use it; with no
# DATABASE_URL set (e.g. running the API/worker natively without Docker),
# they fall back to the no-op NullRunRepository, so nothing here is a hard
# requirement to run ZeroShield. Its host port is 5433, not Postgres's
# default 5432, for the same non-default-port reason documented above for
# rabbitmq/minio.
#
# worker/dashboard also get ZEROSHIELD_EVIDENCE_BACKEND=minio here, making
# MinIO the default evidence store for the containerised platform, while the
# bare-Python/CI/test default remains local (LocalEvidenceRepository) -
# see zeroshield.services.experiment_service._default_evidence_repository.
#
# web (V2 Phase 4) is the primary ZeroShield UI - a separate Next.js image (apps/web/
# Dockerfile), never sharing the Python image. It consumes the api service exclusively
# (API_BASE_URL, plus its own same-origin "/api/*" rewrite for the browser) - never
# Postgres/MinIO/RabbitMQ/Python directly. Host port 3001, not Next's default 3000,
# because Grafana already uses 3000 in this same compose file.
#
# intelligence-worker (V2 Phase 2) consumes the separate
# zeroshield.intelligence_syncs queue (zeroshield.worker.intelligence_main) so
# a slow/large NVD/CISA/EPSS sync never competes with or blocks
# experiment-run job processing on the `worker` service. Same image, just a
# different command - not a new microservice. Requires DATABASE_URL (the
# threat-intelligence system of record is PostgreSQL-backed, not optional).

services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: zeroshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroshield123}
      POSTGRES_DB: zeroshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeroshield -d zeroshield"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: zeroshield
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zeroshield123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  api:
    build: .
    image: zeroshield:latest
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://zeroshield:${POSTGRES_PASSWORD:-zeroshield123}@postgres:5432/zeroshield
    volumes:
      - ./results:/app/results
      - ./overleaf_exports:/app/overleaf_exports
      - ./jobs:/app/jobs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "zeroshield.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build: .
    image: zeroshield:latest
    ports:
      - "9200:9200"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://zeroshield:${POSTGRES_PASSWORD:-zeroshield123}@postgres:5432/zeroshield
      ZEROSHIELD_EVIDENCE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: zeroshield
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zeroshield123}
      MINIO_SECURE: "false"
    volumes:
      - ./results:/app/results
      - ./jobs:/app/jobs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["python", "-m", "zeroshield.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  intelligence-worker:
    build: .
    image: zeroshield:latest
    ports:
      - "9201:9201"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://zeroshield:${POSTGRES_PASSWORD:-zeroshield123}@postgres:5432/zeroshield
    volumes:
      - ./experiments:/app/experiments
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "zeroshield.worker.intelligence_main"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9201/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  dashboard:
    build: .
    image: zeroshield:latest
    ports:
      - "8502:8501"
    environment:
      ZEROSHIELD_EVIDENCE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: zeroshield
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zeroshield123}
      MINIO_SECURE: "false"
    volumes:
      - ./results:/app/results
      - ./overleaf_exports:/app/overleaf_exports
    depends_on:
      minio:
        condition: service_healthy
    command: ["python", "-m", "streamlit", "run", "src/zeroshield/dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build: ./apps/web
    image: zeroshield-web:latest
    ports:
      - "3001:3000"
    environment:
      # Server-side base URL (Server Components/Route Handlers, running in Node, reach
      # the api service directly on the compose network). The browser never talks to
      # this host:port - it goes through this app's own "/api/*" rewrite instead, so
      # the API never needs to grant CORS to this origin. See apps/web/next.config.ts.
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: zeroshield
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-zeroshield123}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  